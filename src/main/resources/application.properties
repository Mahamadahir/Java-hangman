spring.application.name=hangman-web

# Local/dev default: in-memory H2. Production overrides SPRING_DATASOURCE_* via env
# (the OpenShift Postgres Secret) without touching this file.
spring.datasource.url=jdbc:h2:mem:hangman;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The production schema predates Flyway (created by the old ddl-auto=update),
# so baseline the existing table as version 1 rather than trying to recreate it.
# On an empty schema this is ignored and V1 runs normally.
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
